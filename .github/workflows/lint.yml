name: lint

# Runs the same pre-commit hooks as local commits (secret scan, ruff, hygiene),
# so nothing slips through if hooks weren't installed on a machine.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

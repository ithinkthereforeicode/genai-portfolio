name: resume-app CI

on:
  pull_request:
    paths:
      - "projects/resume-app/**"
      - ".github/workflows/resume-app-ci.yml"
  push:
    branches: [main]
    paths:
      - "projects/resume-app/**"
      - ".github/workflows/resume-app-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/resume-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: projects/resume-app/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

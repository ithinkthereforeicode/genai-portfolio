# Pre-commit hooks — run automatically on `git commit` once installed:
#   pip install pre-commit && pre-commit install
# Run against everything:   pre-commit run --all-files
# Bump hook versions:       pre-commit autoupdate
repos:
  # Block secrets (API keys, tokens, session cookies) before they ever reach git history.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Python lint (rules live in ruff.toml).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]

  # General hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-private-key
